        <section class="py-5">
          <h2 class="text-center mb-4">Accede a tu cuenta</h2>

          <!-- Botones -->
          <div class="text-center mb-4">
            <button class="btn btn-outline-dark me-2" onclick="mostrarFormulario('login')">Iniciar sesión</button>
            <button class="btn btn-outline-dark" onclick="mostrarFormulario('registro')">Registrarse</button>
          </div>

          <!-- Formulario de inicio de sesión -->
          <div id="form-login" class="col-md-6 mx-auto">
            <div class="card shadow-sm">
              <div class="card-body">
                <h4 class="card-title mb-4 text-center">Iniciar sesión</h4>
                <form>
                  <form id="loginForm">
                    <div class="mb-3">
                      <label for="correo" class="form-label">Correo electrónico</label>
                      <input type="email" class="form-control" id="correo" maxlength="100" required>
                      <span id="mensajeCorreo" class="text-danger small error"></span>
                    </div>
                    <div class="mb-3">
                      <label for="password" class="form-label">Contraseña</label>
                      <input type="password" class="form-control" id="password" minlength="4" maxlength="10" required>
                      <span id="mensajepassword" class="text-danger small error"></span>
                    </div>
                    <div class="text-end">
                      <!-- <button type="submit" class="btn btn-dark">Entrar</button> -->
                       <button type="button" class="btn btn-dark text-center" id="btnEnviar">Entrar</button><br>
                      <span id="mensajeInicioSesion" class="text-danger small error"></span>
                    </div>
                  </form>
              </div>
            </div>
          </div>

          <!-- Formulario de registro -->
          <div id="form-registro" class="col-md-6 mx-auto d-none">
            <div class="card shadow-sm mt-4">
              <div class="card-body">
                <h4 class="card-title mb-4 text-center">Registro</h4>
                <form>
                  <div class="mb-3">
                    <label for="nombreRegistro" class="form-label">Rut</label> <!-- validar si es un run correcto, sin punto ni guion, min 7 max 9-->
                    <input type="text" class="form-control" id="rutRegistro" required>
                  </div>
                  <div class="mb-3">
                    <label for="nombreRegistro" class="form-label">Nombre</label><!--max 50 caracteres-->
                    <input type="text" class="form-control" id="nombreRegistro" required>
                  </div>
                  <div class="mb-3">
                    <label for="nombreRegistro" class="form-label">Apellidos</label><!--max 100 caracteres-->
                    <input type="text" class="form-control" id="apellidosRegistro" required>
                  </div>
                  <div class="mb-3">
                    <label for="emailRegistro" class="form-label">Correo electrónico</label><!--max 100 caracteres, Validar Solo correos con @duoc.cl, @profesor.duoc.cl y @gmail.com-->
                    <input type="email" class="form-control" id="emailRegistro" required>
                  </div>
                  <div class="mb-3">
                    <label for="passwordRegistro" class="form-label">Fecha de Nacimiento</label>  <!--modificar tipo de input-->
                    <input type="password" class="form-control" id="passwordRegistro" required>
                  </div>
                  <!--  tipo de usuario, enviar siempre usuario  -->
                  <!--agregar region con box regiones que etan en un arreglo de js-->
                  <!--agregar comuna con box-->
                  
                  <div class="mb-3">
                    <label for="passwordRegistro" class="form-label">Dirección</label><!--max 300 caracteres-->
                    <input type="password" class="form-control" id="passwordRegistro" required>
                  </div>
                  <div class="mb-3">
                    <label for="passwordRegistro" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="passwordRegistro" required>
                  </div>
                  <div class="text-end">
                    <button type="submit" class="btn btn-dark">Registrarse</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
