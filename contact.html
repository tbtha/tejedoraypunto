        <section class="py-5">
        <h2 class="text-center mb-4">Contáctame</h2>
        <div class="row justify-content-center">
            <div class="col-md-8">
            <form>
                <!-- Nombre -->
                <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" placeholder="Escribe tu nombre" required>
                <span id="mensajeNombreContact" class="text-danger small error"></span>
                 </div>

                <!-- Correo -->
                <div class="mb-3">
                <label for="correoContact" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="correoContact" placeholder="ejemplo@correo.com"  required>
                <span id="mensajeCorreoContact" class="text-danger small error"></span>
                </div>

                <!-- Comentario -->
                <div class="mb-3">
                <label for="comentarioContact" class="form-label">Mensaje</label>
                <textarea class="form-control campo-expandido" id="comentarioContact" placeholder="Escribe tu mensaje aquí..." required ></textarea>
                <span id="mensajeComentarioContact" class="text-danger small error"></span>
                </div>

                <!-- Botón -->
                <div class="text-end">
                <!-- <button type="submit" class="btn btn-dark px-4">Enviar</button> -->
                    <button type="button" class="btn btn-dark text-center" id="btnContact">Enviar</button><br>
                    <span id="mensajeContact" class="text-danger small error"></span>
                </div>
            </form>
            </div>
        </div>
